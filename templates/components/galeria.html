{% load static %}

<section id="galeria" class="gallery-section">

    <div class="container">

        <!-- ENCABEZADO -->

        <div class="text-center gallery-header">

            <span class="section-subtitle">
                DESCUBRE PIKITZA KUCHA
            </span>

            <h2 class="section-title">
                Un lugar para vivir y recordar
            </h2>

            <p>
                Explora algunos de los paisajes y espacios naturales
                que hacen especial nuestra experiencia.
            </p>

        </div>


        <!-- GALERÍA -->

        <div class="gallery-grid">

            <!-- IMAGEN 1 -->

            <div class="gallery-item gallery-large">

                <img
                    src="{% static 'img/rio-1.jpg' %}"
                    alt="Río de Pikitza Kucha"
                >

                <div class="gallery-overlay">

                    <span>Río Pikitza Kucha</span>

                </div>

            </div>


            <!-- IMAGEN 2 -->

            <div class="gallery-item">

                <img
                    src="{% static 'img/rio-2.jpg' %}"
                    alt="Naturaleza de Pikitza Kucha"
                >

                <div class="gallery-overlay">

                    <span>Naturaleza</span>

                </div>

            </div>


            <!-- IMAGEN 3 -->

            <div class="gallery-item">

                <img
                    src="{% static 'img/rio-3.jpg' %}"
                    alt="Balneario natural"
                >

                <div class="gallery-overlay">

                    <span>Balneario natural</span>

                </div>

            </div>


            <!-- IMAGEN 4 -->

            <div class="gallery-item">

                <img
                    src="{% static 'img/rio-4.jpg' %}"
                    alt="Paisaje amazónico"
                >

                <div class="gallery-overlay">

                    <span>Paisaje amazónico</span>

                </div>

            </div>


            <!-- IMAGEN 5 -->

            <div class="gallery-item gallery-wide">

                <img
                    src="{% static 'img/rio-5.jpg' %}"
                    alt="Experiencia en Pikitza Kucha"
                >

                <div class="gallery-overlay">

                    <span>Momentos inolvidables</span>

                </div>

            </div>

        </div>

    </div>

</section>
