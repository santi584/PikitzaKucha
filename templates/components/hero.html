{% load static %}

<section class="hero" id="inicio">

    <div class="overlay"></div>

    <img
        src="{% static 'img/hero.jpg' %}"
        class="hero-image"
        alt="Balneario Pikitza Kucha"
    >

    <div class="hero-content container">

        <span class="badge bg-success px-3 py-2 mb-3">
            Turismo • Naturaleza • Aventura
        </span>

        <h1>PIKITZA KUCHA</h1>

        <p>
            Descubre un rincón único de la Amazonía ecuatoriana,
            donde la naturaleza, el río y la tranquilidad se unen
            para brindarte una experiencia inolvidable.
        </p>

        <div class="mt-4">

            <a
                href="#nosotros"
                class="btn btn-success btn-lg me-3"
            >
                Explorar
            </a>

            <a
                href="#contacto"
                class="btn btn-outline-light btn-lg"
            >
                Contacto
            </a>

        </div>

    </div>

</section>
